feature: "001-driver-scorecard"
title: Driver scorecard
flow: feature
tier: standard
created: "2026-08-14"
owner: alex.pm@example.com
gates:
  spec.product:
    status: approved
    by: alex.pm@example.com
    at: "2026-08-14"
    note: Criteria reviewed with two pilot accounts; AC3 added after their feedback
  spec.ux:
    status: approved
    by: jo.ux@example.com
    at: "2026-08-15"
    note: All seven states specified; WCAG 2.2 AA, 360px minimum
  design.architecture:
    status: approved
    by: sam.arch@example.com
    at: "2026-08-18"
    note: Batch rollup over on-demand; on-demand measured at 11s and cannot meet AC8
  design.security:
    status: approved
    by: dev.sec@example.com
    at: "2026-08-18"
    note: >-
      Cross-fleet disclosure is the primary risk. Approved once authz moved to
      server-side per-request and driver_id was removed from log fields and
      metric labels.
  design.performance:
    status: approved
    by: rin.perf@example.com
    at: "2026-08-18"
    note: Budgets set against the largest real account (1340 drivers), not the median
  design.observability:
    status: approved
    by: kai.obs@example.com
    at: "2026-08-19"
    note: >-
      Freshness SLI added after review. The failure users notice is not an error
      page, it is a silently stale number they then coach against.
  tasks.scope:
    status: approved
    by: alex.pm@example.com
    at: "2026-08-19"
    note: All 9 criteria traced; T13/T14/T17 recorded as gate obligations, not scope creep
  tasks.testability:
    status: approved
    by: nina.test@example.com
    at: "2026-08-19"
    note: >-
      Test data generator agreed instead of anonymised production data --
      driver behaviour is employment-sensitive and does not belong in a fixture.
  build.implementation:
    status: approved
    by: pat.dev@example.com
    at: "2026-08-24"
    note: 84 unit + 31 integration tests; backfill path noted as untested in evidence.md
  build.code-review:
    status: approved
    by: sam.lead@example.com
    at: "2026-08-25"
    note: Timeout change from 3s to 2.5s reconciled into design.md before approval
  build.pipeline:
    status: approved
    by: mo.devops@example.com
    at: "2026-08-25"
    note: Image scan reports without blocking; reviewed weekly, recorded in evidence.md
  prove.functional:
    status: approved
    by: raj.qa@example.com
    at: "2026-08-26"
    note: All 9 criteria, 7 states and 5 failure modes verified. DEF-1..3 fixed, DEF-4 open.
  prove.security:
    status: approved
    by: dev.sec@example.com
    at: "2026-08-26"
    note: >-
      12 cross-fleet pairs denied; IDOR and CSV formula injection attempted and
      failed. Export governance noted as accepted residual risk.
  prove.performance:
    status: approved
    by: rin.perf@example.com
    at: "2026-08-26"
    note: 1180ms p95 at 1340 drivers against a 2000ms budget. Degradation exercised at 3.3x peak.
  operate.monitoring:
    status: approved
    by: kai.obs@example.com
    at: "2026-08-27"
    note: >-
      All five alerts deliberately fired and observed to route. Two were
      misrouted when first created -- worth noting that testing the alerts
      found this, not an incident.
  operate.support-readiness:
    status: approved
    by: lee.support@example.com
    at: "2026-08-27"
    note: >-
      Team briefed 2026-08-27. Four agent-runnable diagnostics, so most tickets
      resolve without escalation. S1 cross-fleet path drilled explicitly.
  operate.release:
    status: approved
    by: mo.devops@example.com
    at: "2026-08-28"
    note: >-
      Rollback executed on staging and on the two production pilot fleets;
      flag-off propagates in 22s. Monitoring live and support briefed first.
