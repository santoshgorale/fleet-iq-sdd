<text x="24" y="36" font-family="system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="700">How it fits your tooling</text>
<text x="24" y="57" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">Fleet SDD owns Markdown in git. Everything else connects through a thin adapter, and the artifacts stay the source of truth.</text>
