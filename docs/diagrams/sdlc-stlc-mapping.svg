<rect x="24" y="440" width="584" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" />
<text x="38" y="464" font-family="system-ui, sans-serif" font-size="11.5" fill="#b45309" font-weight="700">Testing starts at requirements, not at build</text>
<text x="38" y="484" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">tasks.testability is a gate in slice, held by the Test Lead, whose first question is "could I write</text>
<text x="38" y="498" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">a failing test for this today?" An untestable acceptance criterion is cheapest to fix while it is</text>
<text x="38" y="512" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">still a sentence.</text>
<rect x="632" y="440" width="584" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" />
<text x="646" y="464" font-family="system-ui, sans-serif" font-size="11.5" fill="#b45309" font-weight="700">Operations is inside the lifecycle, not after it</text>
<text x="646" y="484" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">operate is stage six, not a hand-off. operate.monitoring requires that every alert has been</text>
<text x="646" y="498" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">deliberately fired and observed to route — an alert nobody has seen fire is a belief, not a</text>
<text x="646" y="512" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">control.</text>
